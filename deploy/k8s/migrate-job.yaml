# Applies the database schema once and exits. Run it and wait for it to finish before applying api.yaml and
# gateway.yaml:  kubectl wait --for=condition=complete job/paysys-migrate -n paysys --timeout=300s
apiVersion: batch/v1
kind: Job
metadata:
  name: paysys-migrate
  namespace: paysys
spec:
  backoffLimit: 4
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: migrate
          image: paysys-migrate:local
          imagePullPolicy: IfNotPresent
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: paysys-secrets, key: postgres-password }
            - name: ConnectionStrings__Paysys
              value: "Host=postgres;Port=5432;Database=paysys;Username=postgres;Password=$(POSTGRES_PASSWORD)"
