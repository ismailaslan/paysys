name: scan

# A manual attack scan: OWASP ZAP runs its API scan (active attacks) against a throwaway copy of the API
# on a throwaway Postgres on the runner, signed in as a normal user. It never touches Neon or the live demo.
# Start it from the Actions tab: "scan" -> "Run workflow". The report is kept as an artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      ConnectionStrings__Paysys: Host=localhost;Port=5432;Database=paysys_scan;Username=postgres;Password=postgres

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Create the schema
        run: |
          dotnet tool restore
          dotnet ef database update --project src/Paysys.DAL --startup-project src/Paysys.DAL

      - name: Start the API
        env:
          ASPNETCORE_ENVIRONMENT: Development
          ASPNETCORE_URLS: http://0.0.0.0:5080
          Jwt__SigningKey: scan-only-signing-key-0123456789abcdef0123456789
        run: |
          dotnet run --project src/Paysys.Api --configuration Release --no-launch-profile > api.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:5080/healthz && break
            sleep 2
          done
          curl -sf http://localhost:5080/healthz

      - name: Sign in as a normal user and get the API description
        run: |
          curl -sf -X POST http://localhost:5080/api/auth/register -H 'Content-Type: application/json' \
            -d '{"username":"scanuser","password":"a-long-enough-password","accountKind":"individual"}'
          token=$(curl -sf -X POST http://localhost:5080/api/auth/login -H 'Content-Type: application/json' \
            -d '{"username":"scanuser","password":"a-long-enough-password","accountKind":"individual"}' | python3 -c 'import sys,json; print(json.load(sys.stdin)["token"])')
          echo "::add-mask::$token"
          echo "TOKEN=$token" >> "$GITHUB_ENV"
          mkdir -p zap && curl -sf http://localhost:5080/openapi/v1.json -o zap/openapi.json
          chmod -R 777 zap

      - name: Run the ZAP API scan
        run: |
          docker run --rm --network host -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t /zap/wrk/openapi.json -f openapi -S -I \
            -r report.html -J report.json -w report.md \
            -z "-config replacer.full_list(0).description=auth -config replacer.full_list(0).enabled=true -config replacer.full_list(0).matchtype=REQ_HEADER -config replacer.full_list(0).matchstr=Authorization -config replacer.full_list(0).regex=false -config replacer.full_list(0).replacement='Bearer $TOKEN'" \
            -O http://localhost:5080

      - name: Show the result
        if: always()
        run: |
          if [ -f zap/report.md ]; then cat zap/report.md >> "$GITHUB_STEP_SUMMARY"; fi
          echo "--- API log tail ---"; tail -n 20 api.log || true

      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-report
          path: |
            zap/report.html
            zap/report.json
            zap/report.md
          if-no-files-found: ignore
